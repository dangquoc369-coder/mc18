<!-- ===== CHỐNG "NHÁY" THEME (đợt fix này) =====
     Đọc lựa chọn nền sáng/tối đã lưu và đặt data-theme lên <html> NGAY LẬP
     TỨC, TRƯỚC khi style.css tải xong và trang vẽ ra - tránh việc trang
     luôn hiện nền tối mặc định trong 1 nhịp rồi mới "nháy" sang nền sáng.
     theme.js (script cuối) chỉ cần đọc lại đúng giá trị này để đồng bộ nút
     bấm, không set lại attribute nữa. -->
<script>
  (function () {
    window.addEventListener('error', function (e) {
      if (e && e.message && (
        e.message.indexOf('ResizeObserver loop completed with undelivered notifications') !== -1 ||
        e.message.indexOf('ResizeObserver loop limit exceeded') !== -1
      )) {
        e.stopImmediatePropagation();
        e.stopPropagation();
        if (typeof e.preventDefault === 'function') e.preventDefault();
        return true;
      }
    }, true);

    try {
      var saved = localStorage.getItem('dq_tracker_theme_v1');
      document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
    } catch (err) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
