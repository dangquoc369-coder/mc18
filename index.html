<!-- ===== CHỐNG "NHÁY" THEME =====
     Đọc lựa chọn nền sáng/tối đã lưu và đặt data-theme lên <html> NGAY
     LẬP TỨC, TRƯỚC khi style.css tải xong và trang vẽ ra - tránh việc trang
     luôn hiện nền tối mặc định trong 1 nhịp rồi mới "nháy" sang nền sáng.
     theme.js (script cuối) chỉ cần đọc lại đúng giá trị này để đồng bộ nút
     bấm, không set lại attribute nữa. -->
<script>
  (function () {
    window.addEventListener('error', function (e) {
      if (e && e.message && (
        e.message.indexOf('ResizeObserver loop completed with undelivered notifications') !== -1 ||
        e.message.indexOf('ResizeObserver loop limit exceeded') !== -1
      )) {
        e.stopImmediatePropagation();
        e.stopPropagation();
        if (typeof e.preventDefault === 'function') e.preventDefault();
        return true;
      }
    }, true);

    try {
      var saved = localStorage.getItem('dq_tracker_theme_v1');
      var t = saved === 'light' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch (err) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>

      <!-- Thanh điều khiển DÙNG CHUNG cho mọi ô.
           Màn DỌC: nằm riêng 1 hàng dưới #topbar (như cũ).
           Màn NGANG: script ngay bên dưới chuyển nó VÀO TRONG #topbar để
           cả hai cùng 1 hàng (xem css/topbar-landscape.css). -->
      <div id="controlBar">
        <span class="control-label">Khung giờ</span>
        <div id="sharedTimeframeGroup" class="timeframe-group"></div>
        <span class="control-label">Vẽ</span>
        <div id="sharedDrawGroup" class="timeframe-group"></div>
      </div>

      <!-- ===== GỘP TOPBAR + CONTROLBAR Ở MÀN NGANG =====
           Đặt NGAY SAU #controlBar để chạy trước khi trang vẽ lần đầu (không
           bị nháy 2 hàng -> 1 hàng). Chỉ di chuyển node (giữ nguyên id và
           mọi event listener) nên ui.js/tasks.js/analytics.js/fullscreen.js
           không cần sửa: tasks.js/analytics.js vẫn ẩn #controlBar bằng
           style.display, fullscreen vẫn ẩn #topbar (chứa luôn controlBar).
           Xoay máy / đổi cỡ cửa sổ -> tự gộp / tách lại. -->
      <script>
        (function () {
          var mq = window.matchMedia('(orientation: landscape)');
          function place() {
            var topbar = document.getElementById('topbar');
            var bar = document.getElementById('controlBar');
            var root = document.documentElement;
            if (!topbar || !bar) return;
            if (mq.matches) {
              if (bar.parentNode !== topbar) {
                topbar.insertBefore(bar, topbar.querySelector('.topbar-right'));
              }
              root.classList.add('tb-merged');
            } else {
              if (bar.parentNode === topbar) {
                topbar.parentNode.insertBefore(bar, topbar.nextSibling);
              }
              root.classList.remove('tb-merged');
            }
          }
          place();
          if (mq.addEventListener) mq.addEventListener('change', place);
          else if (mq.addListener) mq.addListener(place);
        })();
      </script>
